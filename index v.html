<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zesto Vendor Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#f6f8f7;--card:#fff;--line:#dfe7e2;--accent:#075b3a;--accent2:#0a6b45;--light:#e4f2eb;--text:#17231d;--muted:#6b766f;--warn:#fff7db;--danger:#e5395b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:1000px;margin:auto;padding:18px}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.topin{max-width:1000px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;background:#064d34;color:#fff;display:grid;place-items:center;font-weight:800}h1,h2,h3{font-family:Poppins,sans-serif}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}.stat b{display:block;font-size:25px;color:var(--accent)}.muted{color:var(--muted)}.small{font-size:13px}label{font-weight:700;display:block;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid #cfd9d3;border-radius:12px;padding:12px;background:#fff;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{min-height:90px}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-outline{background:#fff;color:var(--accent);border:1px solid var(--accent)}.btn-danger{background:var(--danger)}.btn-block{width:100%}.badge{padding:6px 10px;border-radius:999px;background:var(--light);color:var(--accent);font-size:12px;font-weight:800}.badge.warn{background:var(--warn);color:#8a6200}.order{border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px}.notice{padding:12px;border-radius:12px;background:var(--light);margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.row.mobile-col{flex-direction:column;align-items:stretch}}
</style></head><body>
<header class="top"><div class="topin"><div class="logo">z</div><div><h1 style="margin:0;font-size:20px">Zesto Vendor Panel</h1><div class="muted small">Restaurant order management</div></div><button id="logout" class="btn btn-outline" style="margin-left:auto;display:none">Logout</button></div></header>
<main class="wrap"><div id="auth"></div><div id="app" class="hidden"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyDG6bNRnVdWcbKGhKi0USnwlW85AfSvao4",
  authDomain:"zesto-app-7abc1.firebaseapp.com",
  databaseURL:"https://zesto-app-7abc1-default-rtdb.firebaseio.com",
  projectId:"zesto-app-7abc1",
  storageBucket:"zesto-app-7abc1.firebasestorage.app",
  messagingSenderId:"967929616021",
  appId:"1:967929616021:web:a021372423680a2ae42d9c"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const $=s=>document.querySelector(s);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const toast=m=>alert(m);
async function hash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
let session=JSON.parse(localStorage.getItem('zesto_vendor_session')||'null'), vendor=null, orders=[], products=[], locationWatchId=null;
const vendorsRef=db.ref('vendors'), ordersRef=db.ref('orders'), productsRef=db.ref('products');

function showAuth(){
 $('#logout').style.display='none'; $('#app').classList.add('hidden');
 $('#auth').innerHTML=`<div class="card" style="max-width:520px;margin:35px auto">
 <h2 style="text-align:center;margin-top:0">Vendor Login</h2>
 <p class="muted" style="text-align:center">Sign in to receive and manage customer orders.</p>
 <form id="login"><label>Email</label><input id="le" type="email" required>
 <label>Password</label><input id="lp" type="password" required>
 <button class="btn btn-block" style="margin-top:14px">Login</button></form>
 <div style="height:1px;background:var(--line);margin:18px 0"></div>
 <button class="btn btn-outline btn-block" id="register">New Vendor? Create Account</button></div>`;
 $('#login').onsubmit=login; $('#register').onclick=showRegister;
}
function showRegister(){
 $('#auth').innerHTML=`<div class="card" style="max-width:620px;margin:20px auto">
 <h2 style="margin-top:0">Vendor Registration</h2>
 <p class="muted">Create a restaurant/vendor account. For production, admin approval should be enabled before accepting live orders.</p>
 <form id="reg"><label>Restaurant / Vendor Name *</label><input id="name" required>
 <label>Owner Name</label><input id="owner">
 <div class="row mobile-col"><div style="flex:1"><label>Mobile *</label><input id="phone" type="tel" required></div><div style="flex:1"><label>Email *</label><input id="email" type="email" required></div></div>
 <label>Restaurant Address *</label><textarea id="address" required></textarea>
 <div class="row mobile-col"><div style="flex:1"><label>City</label><input id="city"></div><div style="flex:1"><label>Pincode</label><input id="pin"></div></div>
 <label>Password *</label><input id="pass" type="password" minlength="6" required>
 <div class="notice"><b>Current Location</b><div id="reg-location" class="small muted">Capture your current GPS location before submitting.</div>
 <button type="button" class="btn btn-outline" id="get-reg-location" style="margin-top:10px"><i class="fa-solid fa-location-crosshairs"></i> Get Current Location</button></div>
 <input id="reg-lat" type="hidden"><input id="reg-lng" type="hidden">
 <button class="btn btn-block" style="margin-top:14px">Submit Vendor Registration</button></form>
 <button class="btn btn-outline btn-block" id="back" style="margin-top:8px">Back to Login</button></div>`;
 $('#back').onclick=showAuth;
 let regLat='',regLng='';
 const setRegLoc=(lat,lng)=>{$('#reg-lat').value=lat;$('#reg-lng').value=lng;regLat=lat;regLng=lng;$('#reg-location').textContent=`Location captured: ${lat.toFixed(6)}, ${lng.toFixed(6)}`};
 $('#get-reg-location').onclick=()=>{
   if(!navigator.geolocation){alert('Geolocation is not supported on this device/browser.');return}
   const b=$('#get-reg-location');b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Getting Location...';
   navigator.geolocation.getCurrentPosition(p=>{setRegLoc(p.coords.latitude,p.coords.longitude);b.disabled=false;b.innerHTML='<i class="fa-solid fa-location-crosshairs"></i> Refresh Location'},
   e=>{b.disabled=false;b.innerHTML='<i class="fa-solid fa-location-crosshairs"></i> Get Current Location';alert(e.code===1?'Location permission was denied. Please allow location access.':'Could not get current location.')},
   {enableHighAccuracy:true,timeout:15000,maximumAge:0});
 };
 $('#reg').onsubmit=register;
}
async function register(e){
 e.preventDefault();
 const email=$('#email').value.trim().toLowerCase();
 if(!$('#reg-lat').value||!$('#reg-lng').value){alert('Please capture your current location before submitting registration.');return}
 const all=Object.values((await vendorsRef.once('value')).val()||{});
 if(Object.values(all).some(v=>(v.email||'').toLowerCase()===email)){toast('A vendor account already exists for this email.');return}
 const key=vendorsRef.push().key;
 await vendorsRef.child(key).set({firebaseKey:key,name:$('#name').value.trim(),ownerName:$('#owner').value.trim(),phone:$('#phone').value.trim(),email,address:$('#address').value.trim(),city:$('#city').value.trim(),pincode:$('#pin').value.trim(),passwordHash:await hash($('#pass').value),status:'Pending',workStatus:'Inactive',
currentLocation:{lat:Number($('#reg-lat').value),lng:Number($('#reg-lng').value),updatedAt:Date.now(),online:false},
registrationLocation:{lat:Number($('#reg-lat').value),lng:Number($('#reg-lng').value),capturedAt:Date.now()},
createdAt:Date.now()});
 toast('Vendor account created. You can now login.'); showAuth();
}
async function login(e){
 e.preventDefault(); const email=$('#le').value.trim().toLowerCase(), ph=await hash($('#lp').value);
 const all=Object.values((await vendorsRef.once('value')).val()||{});
 const found=all.find(v=>(v.email||'').toLowerCase()===email&&v.passwordHash===ph);
 if(!found){toast('Invalid email or password.');return}
 if(found.status==='Pending'){toast('Your registration is awaiting Admin approval.');return}
 if(found.status==='Rejected'){toast('Your registration was rejected by Admin.');return}
 if(found.status==='Blocked'){toast('This vendor account is blocked.');return}
 session={email:found.email};localStorage.setItem('zesto_vendor_session',JSON.stringify(session));loadApp();
}
function logout(){localStorage.removeItem('zesto_vendor_session');session=null;vendor=null;showAuth()}
$('#logout').onclick=logout;
vendorsRef.on('value',()=>{if(session)loadApp()});
ordersRef.on('value',s=>{const raw=s.val()||{};orders=Object.entries(raw).map(([key,o])=>({...o,firebaseKey:o.firebaseKey||key}));if(vendor)renderDashboard()});
productsRef.on('value',s=>{const raw=s.val()||{};products=Object.entries(raw).map(([key,p])=>({...p,firebaseKey:p.firebaseKey||key}));if(vendor)renderDashboard()});

function stopLocationTracking(){if(locationWatchId!==null){navigator.geolocation.clearWatch(locationWatchId);locationWatchId=null}}
function startLocationTracking(){
 stopLocationTracking(); if(!vendor||!navigator.geolocation)return;
 const ref=vendorsRef.child(vendor.firebaseKey).child('currentLocation');
 ref.onDisconnect().update({online:false,updatedAt:Date.now()}).catch(()=>{});
 ref.update({online:true,updatedAt:Date.now()}).catch(()=>{});
 locationWatchId=navigator.geolocation.watchPosition(p=>{
   ref.update({lat:Number(p.coords.latitude),lng:Number(p.coords.longitude),accuracy:Number(p.coords.accuracy||0),updatedAt:Date.now(),online:true}).catch(()=>{});
 },()=>ref.update({online:false,updatedAt:Date.now()}).catch(()=>{}),
 {enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}
async function loadApp(){
 if(!session)return showAuth();
 const all=Object.values((await vendorsRef.once('value')).val()||{});
 vendor=all.find(v=>(v.email||'').toLowerCase()===session.email.toLowerCase());
 if(!vendor){logout();return}
 $('#auth').innerHTML='';$('#app').classList.remove('hidden');$('#logout').style.display='inline-flex';startLocationTracking();renderDashboard();
}
function belongsToVendor(o){
 const id=vendor?.firebaseKey;
 return o.vendorId===id || (o.vendor&&((o.vendor.id===id)||(o.vendor.email||'').toLowerCase()===(vendor.email||'').toLowerCase()));
}
function isClaimable(o){
 const terminal=['Delivered','Cancelled'];
 if(terminal.includes(o.status)||o.vendorAcceptedAt)return false;
 return o.vendorId===vendor?.firebaseKey;
}
function paymentText(o){if(o.paymentMethod==='cod')return 'Cash on Delivery';if(o.paymentMethod==='online')return 'Online / UPI';return 'Not specified'}
function paymentStatus(o){if(o.paymentStatus==='paid')return 'Confirmed';if(o.paymentStatus==='processing')return 'Processing';if(o.paymentStatus==='pending')return 'Verification Pending';if(o.paymentStatus==='not_required')return 'COD';return 'Pending'}

function renderDashboard(){
 if(!vendor)return;
 const mine=orders.filter(belongsToVendor).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const incoming=orders.filter(o=>isClaimable(o)&&vendor.workStatus!=='Inactive').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const accepted=mine.filter(o=>['Vendor Accepted','Preparing','Ready for Pickup'].includes(o.vendorStatus)).length;
 const ready=mine.filter(o=>o.vendorStatus==='Ready for Pickup').length;
 const delivered=mine.filter(o=>o.status==='Delivered').length;
 $('#app').innerHTML=`<div class="card"><div class="row mobile-col"><div><h2 style="margin:0">Welcome, ${esc(vendor.name)}</h2><div class="muted small">${esc(vendor.email)} · ${esc(vendor.phone||'')}</div></div><span class="badge">${vendor.currentLocation?.online?'GPS Online':'GPS Offline'}</span></div>
 <div class="notice"><b>Vendor order flow</b><br><span class="small">Customer → Firebase → Selected Vendor → Accept → Preparation Time → Ready → Delivery → Customer</span></div>
 <div class="small muted" style="margin-top:8px">Live GPS: ${vendor.currentLocation?.lat?`${Number(vendor.currentLocation.lat).toFixed(6)}, ${Number(vendor.currentLocation.lng).toFixed(6)}`:'Not available'}</div></div>
 <div class="grid"><div class="stat"><b>${incoming.length}</b><span>New Orders</span></div><div class="stat"><b>${accepted}</b><span>Accepted</span></div><div class="stat"><b>${ready}</b><span>Ready</span></div><div class="stat"><b>${delivered}</b><span>Delivered</span></div></div>
 <div class="card"><h3 style="margin-top:0">New Customer Orders (${incoming.length})</h3>${incoming.length?incoming.map(o=>orderHtml(o,false)).join(''):'<div class="muted">No new orders right now.</div>'}</div>
 <div class="card"><div class="row"><h3 style="margin:0">My Products (${products.filter(p=>p.vendorId===vendor.firebaseKey).length})</h3><button class="btn btn-sm" onclick="showProductForm()"><i class="fa-solid fa-plus"></i> Add Product</button></div><div id="vendor-products">${productHtml(products.filter(p=>p.vendorId===vendor.firebaseKey))}</div></div>
 <div class="card"><h3 style="margin-top:0">My Vendor Orders (${mine.length})</h3>${mine.length?mine.map(o=>orderHtml(o,true)).join(''):'<div class="muted">No accepted orders yet.</div>'}</div>`;
}

function productHtml(list){
 if(!list.length)return '<div class="muted" style="margin-top:10px">No products yet.</div>';
 return list.map(p=>`<div class="order"><div class="row"><div><b>${esc(p.name||'Product')}</b><div class="small muted">${esc(p.category||'')} · ${money(p.price)}</div></div><span class="badge">${p.active===false?'Inactive':'Active'}</span></div>${p.imageUrl?`<img src="${esc(p.imageUrl)}" style="width:70px;height:70px;object-fit:cover;border-radius:10px;margin-top:8px">`:''}<div class="actions"><button class="btn btn-outline" onclick="editProduct('${esc(p.firebaseKey)}')">Edit</button><button class="btn btn-danger" onclick="deleteProduct('${esc(p.firebaseKey)}')">Delete</button></div></div>`).join('');
}
function showProductForm(editKey=''){
 const p=products.find(x=>x.firebaseKey===editKey)||{}, area=$('#vendor-products'); if(!area)return;
 area.innerHTML=`<div class="notice"><h3 style="margin-top:0">${editKey?'Edit':'Add'} Product</h3><label>Product Name *</label><input id="vp-name" value="${esc(p.name||'')}"><label>Price (₹) *</label><input id="vp-price" type="number" min="0" value="${Number(p.price||0)}"><label>MRP (₹)</label><input id="vp-mrp" type="number" min="0" value="${Number(p.priceMrp||0)}"><label>Category</label><input id="vp-cat" value="${esc(p.category||'')}"><label>Image</label><input id="vp-img-file" type="file" accept="image/*"><input id="vp-img" placeholder="Or image URL" value="${esc(p.imageUrl||'')}"><div class="actions"><button class="btn" onclick="saveProduct('${esc(editKey)}')">Save Product</button><button class="btn btn-outline" onclick="renderDashboard()">Cancel</button></div></div>`;
}
function fileData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function saveProduct(key){
 if(!vendor)return;
 const name=$('#vp-name').value.trim(),price=Number($('#vp-price').value||0),mrp=Number($('#vp-mrp').value||0),category=$('#vp-cat').value.trim();
 if(!name||price<0){alert('Enter product name and valid price.');return}
 let imageUrl=$('#vp-img').value.trim();const f=$('#vp-img-file').files?.[0];
 if(f){if(f.size>1200000){alert('Image must be under 1.2 MB.');return}imageUrl=await fileData(f)}
 const k=key||productsRef.push().key, old=products.find(p=>p.firebaseKey===key)||{};
 await productsRef.child(k).set({...old,firebaseKey:k,id:old.id||k,name,price,priceMrp:mrp,category,imageUrl,active:true,vendorId:vendor.firebaseKey,vendorName:vendor.name,vendorEmail:vendor.email,createdAt:old.createdAt||Date.now(),updatedAt:Date.now()});
 toast('Product saved.');renderDashboard();
}
function editProduct(k){showProductForm(k)}
async function deleteProduct(k){const p=products.find(x=>x.firebaseKey===k);if(!p||p.vendorId!==vendor.firebaseKey)return;if(!confirm('Delete this product?'))return;await productsRef.child(k).remove();toast('Product deleted.')}
window.showProductForm=showProductForm;window.saveProduct=saveProduct;window.editProduct=editProduct;window.deleteProduct=deleteProduct;

function orderHtml(o,mine){
 const vs=o.vendorStatus||'New';
 const readyAt=o.vendorReadyAt?new Date(o.vendorReadyAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
 return `<div class="order"><div class="row"><b>#${esc(o.orderId||'')}</b><span class="badge ${vs==='Ready for Pickup'?'':'warn'}">${esc(vs)}</span></div>
 <div style="font-weight:800;margin-top:8px">${esc(o.customer?.name||'Customer')}</div>
 <div class="muted small"><i class="fa-solid fa-phone"></i> ${esc(o.customer?.phone||'—')}</div>
 <div class="muted small" style="margin-top:4px"><i class="fa-solid fa-location-dot"></i> ${esc(o.customer?.address||'—')}, ${esc(o.customer?.city||'')} ${esc(o.customer?.pincode||'')}</div>
 <div class="small" style="margin-top:8px"><b>Items:</b> ${esc((o.items||[]).map(i=>`${i.name} × ${i.qty}`).join(', ')||'—')}</div>
 <div class="small" style="margin-top:7px"><b>Total:</b> ${money(o.amount||o.total||0)} &nbsp; <b>Payment:</b> ${esc(paymentText(o))} · ${esc(paymentStatus(o))}</div>
 ${o.vendorPrepMinutes?`<div class="notice small"><b>Preparation:</b> ${esc(o.vendorPrepMinutes)} minutes · ETA ${readyAt}</div>`:''}
 ${o.deliveryBoy?`<div class="notice small"><b>Delivery Boy:</b> ${esc(o.deliveryBoy.name||'Assigned')} · ${esc(o.deliveryStatus||'Assigned')}</div>`:''}
 <div class="actions">
 ${!mine?`<button class="btn" onclick="acceptOrder('${esc(o.firebaseKey)}')"><i class="fa-solid fa-check"></i> Accept Order</button>`:
 vs==='Vendor Accepted'?`<button class="btn" onclick="setPrep('${esc(o.firebaseKey)}')"><i class="fa-solid fa-stopwatch"></i> Set Preparation Time</button>`:
 vs==='Preparing'?`<button class="btn" onclick="markReady('${esc(o.firebaseKey)}')"><i class="fa-solid fa-circle-check"></i> Mark Ready</button>`:
 vs==='Ready for Pickup'?`<span class="badge">Waiting for Delivery Pickup</span>`:''}
 ${o.customer?.phone?`<a class="btn btn-outline" href="tel:${esc(o.customer.phone)}"><i class="fa-solid fa-phone"></i> Call Customer</a>`:''}
 ${o.deliveryLocation?`<a class="btn btn-outline" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${o.deliveryLocation.lat},${o.deliveryLocation.lng}"><i class="fa-solid fa-map-location-dot"></i> Location</a>`:''}
 </div></div>`;
}
async function acceptOrder(key){
 if(!vendor)return;
 const ref=db.ref('orders/'+key);
 const r=await ref.transaction(o=>{
   if(!o||o.vendorId||o.vendorAcceptedAt||['Delivered','Cancelled'].includes(o.status))return;
   o.vendorId=vendor.firebaseKey;o.vendor={id:vendor.firebaseKey,name:vendor.name,email:vendor.email,phone:vendor.phone,address:vendor.address,city:vendor.city};
   o.vendorName=vendor.name;
   o.vendorStatus='Vendor Accepted';o.vendorAcceptedAt=Date.now();
   o.deliveryOfferStatus='Available';
   o.deliveryStatus='Waiting for Delivery';
   o.status='Restaurant Accepted';
   return o;
 });
 if(r.committed){toast('Order accepted.');renderDashboard()}else toast('Order is no longer available.');
}
async function setPrep(key){
 const v=prompt('How many minutes will the order take to be ready?', '20');
 if(v===null)return; const min=Math.max(1,Math.floor(Number(v)||0)); if(!min){toast('Enter a valid number of minutes.');return}
 await db.ref('orders/'+key).update({vendorPrepMinutes:min,vendorStatus:'Preparing',vendorPrepStartedAt:Date.now(),vendorReadyAt:Date.now()+min*60000,deliveryTimer:min,deliveryOfferStatus:'Available',status:'Preparing'});
 toast(`Preparation time set to ${min} minutes.`);
}
async function markReady(key){
 await db.ref('orders/'+key).update({vendorStatus:'Ready for Pickup',vendorReadyAt:Date.now(),deliveryOfferStatus:'Available',status:'Ready for Pickup'});
 toast('Order marked Ready for Pickup. Delivery can pick it up now.');
}
if(session)loadApp();else showAuth();
</script></body></html>
