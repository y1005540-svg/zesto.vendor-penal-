/* Zesto custom status popups */
#zesto-status-overlay{
  position:fixed;inset:0;z-index:9999;background:rgba(10,20,16,.58);
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(5px);
}
#zesto-status-overlay.show{display:flex}
.zesto-status-modal{
  width:min(92vw,420px);background:#fff;border-radius:24px;padding:26px 22px 22px;
  box-shadow:0 24px 70px rgba(0,0,0,.28);text-align:center;
  animation:zestoModalPop .28s ease-out;
}
@keyframes zestoModalPop{
  from{opacity:0;transform:translateY(18px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.zesto-status-icon{
  width:82px;height:82px;border-radius:50%;margin:0 auto 16px;
  display:grid;place-items:center;position:relative;font-size:34px;
}
.zesto-status-icon.success{background:#e7f7ef;color:#087044}
.zesto-status-icon.pending{background:#fff4dc;color:#b77900}
.zesto-status-icon.success::after{
  content:"";position:absolute;inset:-6px;border:2px solid rgba(8,112,68,.18);
  border-radius:50%;animation:zestoSuccessRing 1.35s ease-out infinite;
}
@keyframes zestoSuccessRing{
  0%{transform:scale(.82);opacity:.8}
  100%{transform:scale(1.22);opacity:0}
}
.zesto-status-icon.pending i{animation:zestoPendingPulse 1.15s ease-in-out infinite}
@keyframes zestoPendingPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.12);opacity:.65}
}
.zesto-status-title{
  margin:0 0 8px;font-family:Poppins,sans-serif;font-size:22px;color:var(--accent);
}
.zesto-status-text{
  margin:0;color:var(--muted);font-size:14px;line-height:1.55;
}
.zesto-status-note{
  margin-top:14px;padding:11px 12px;border-radius:13px;background:#f6f8f7;
  color:#4f5d55;font-size:13px;
}
.zesto-status-btn{
  margin-top:18px;width:100%;border:0;border-radius:13px;padding:13px 16px;
  background:var(--accent);color:#fff;font-weight:800;cursor:pointer;
}

function zestoDialog(mode,message,defaultValue=''){
  const ov=document.getElementById('zesto-dialog-overlay');
  const text=document.getElementById('zesto-dialog-text');
  const input=document.getElementById('zesto-dialog-input');
  const ok=document.getElementById('zesto-dialog-ok');
  const cancel=document.getElementById('zesto-dialog-cancel');
  const icon=document.getElementById('zesto-dialog-icon');
  if(!ov||!text||!input||!ok||!cancel){
    return Promise.resolve(mode==='confirm'?false:mode==='prompt'?null:undefined);
  }
  text.textContent=String(message??'');
  input.style.display=mode==='prompt'?'block':'none';
  cancel.style.display=(mode==='confirm'||mode==='prompt')?'block':'none';
  input.value=mode==='prompt'?String(defaultValue??''):'';
  icon.className=mode==='confirm'?'fa-solid fa-circle-question':mode==='prompt'?'fa-solid fa-pen':'fa-solid fa-circle-info';
  ov.classList.add('show'); ov.setAttribute('aria-hidden','false');
  if(mode==='prompt')setTimeout(()=>{input.focus();input.select()},30);
  return new Promise(resolve=>{
    const finish=v=>{
      ov.classList.remove('show');ov.setAttribute('aria-hidden','true');
      ok.onclick=null;cancel.onclick=null;input.onkeydown=null;
      resolve(v);
    };
    ok.onclick=()=>finish(mode==='prompt'?input.value:mode==='confirm'?true:undefined);
    cancel.onclick=()=>finish(mode==='prompt'?null:false);
    input.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape')cancel.click()};
  });
}
function zAlert(message){return zestoDialog('alert',message)}
function zConfirm(message){return zestoDialog('confirm',message)}
function zPrompt(message,defaultValue=''){return zestoDialog('prompt',message,defaultValue)}

function showStatusPopup(type,title,text,note=''){
  const ov=$('#zesto-status-overlay');
  const icon=$('#zesto-status-icon');
  const titleEl=$('#zesto-status-title');
  const textEl=$('#zesto-status-text');
  const noteEl=$('#zesto-status-note');
  const btn=$('#zesto-status-btn');
  if(!ov||!icon||!titleEl||!textEl||!btn){ zAlert(text); return Promise.resolve(); }

  icon.className='zesto-status-icon '+(type==='pending'?'pending':'success');
  icon.innerHTML=type==='pending'
    ? '<i class="fa-solid fa-hourglass-half"></i>'
    : '<i class="fa-solid fa-check"></i>';

  titleEl.textContent=title;
  textEl.textContent=text;
  if(note){
    noteEl.textContent=note;
    noteEl.classList.remove('hidden');
  }else{
    noteEl.textContent='';
    noteEl.classList.add('hidden');
  }
  ov.classList.add('show');
  ov.setAttribute('aria-hidden','false');

  return new Promise(resolve=>{
    const close=()=>{
      ov.classList.remove('show');
      ov.setAttribute('aria-hidden','true');
      btn.onclick=null;
      resolve();
    };
    btn.onclick=close;
  });
}
async function hash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}

async function register(e){

currentLocation:{lat:Number($('#reg-lat').value),lng:Number($('#reg-lng').value),updatedAt:Date.now(),online:false,source:'registration'},
registrationLocation:{lat:Number($('#reg-lat').value),lng:Number($('#reg-lng').value),capturedAt:Date.now()},
createdAt:Date.now()});
 await showStatusPopup(

 e.preventDefault(); const email=$('#le').value.trim().toLowerCase(), ph=await hash($('#lp').value);

let vendorOrdersQueryId=null;
let vendorOrdersQueryEmail=null;
let vendorOrdersById={};
let vendorOrdersByEmail={};

function detachVendorOrdersListeners(){
 try{vendorOrdersQueryId?.off()}catch(e){}
 try{vendorOrdersQueryEmail?.off()}catch(e){}
 vendorOrdersQueryId=null;
 vendorOrdersQueryEmail=null;
 vendorOrdersById={};
 vendorOrdersByEmail={};
 orders=[];
}

function rebuildVendorOrders(){
 const merged={...vendorOrdersByEmail,...vendorOrdersById};
 orders=Object.entries(merged).map(([key,o])=>({...o,firebaseKey:o?.firebaseKey||key}));
 if(vendor)renderDashboard();
}

function attachVendorOrdersListener(){
 if(!vendor)return;

 detachVendorOrdersListeners();

 // Query only this vendor's orders instead of downloading the full orders node.
 // Recommended Firebase index:
 // "orders": { ".indexOn": ["vendorId","vendorEmail"] }
 vendorOrdersQueryId=ordersRef.orderByChild('vendorId').equalTo(vendor.firebaseKey);
 vendorOrdersQueryEmail=ordersRef.orderByChild('vendorEmail').equalTo((vendor.email||'').toLowerCase());

 vendorOrdersQueryId.on('value',snap=>{
   vendorOrdersById=snap.val()||{};
   rebuildVendorOrders();
 });

 // Legacy fallback for older orders that were saved with vendorEmail.
 vendorOrdersQueryEmail.on('value',snap=>{
   vendorOrdersByEmail=snap.val()||{};
   rebuildVendorOrders();
 });
}

async function loadApp(){
 if(!session)return showAuth();
 const all=Object.values((await vendorsRef.once('value')).val()||{});
 vendor=all.find(v=>(v.email||'').toLowerCase()===session.email.toLowerCase());
 if(!vendor){logout();return}
 $('#auth').innerHTML='';$('#app').classList.remove('hidden');$('#logout').style.display='inline-flex';
 attachVendorOrdersListener();
 renderDashboard();
}
function orderTargetsVendor(o){
 if(!o||!vendor)return false;
 const id=String(vendor.firebaseKey||'').trim();
 const email=String(vendor.email||'').trim().toLowerCase();
 const name=String(vendor.name||'').trim().toLowerCase();

 const orderId=String(o.vendorId||o.vendor?.id||'').trim();
 if(id && orderId && orderId===id)return true;

 const orderEmail=String(o.vendorEmail||o.vendor?.email||'').trim().toLowerCase();
 if(email && orderEmail && orderEmail===email)return true;

 const items=Array.isArray(o.items)?o.items:[];
 if(id && items.some(i=>String(i.vendorId||'').trim()===id))return true;
 if(email && items.some(i=>String(i.vendorEmail||'').trim().toLowerCase()===email))return true;

 // Name is only a legacy fallback when no vendor id/email was stored on the order.
 if(!orderId && !orderEmail && name){
   const orderName=String(o.vendorName||o.vendor?.name||'').trim().toLowerCase();
   if(orderName && orderName===name)return true;
   if(items.some(i=>String(i.vendorName||'').trim().toLowerCase()===name))return true;
 }
 return false;
}
function belongsToVendor(o){
 return orderTargetsVendor(o);
}
function isClaimable(o){
 const terminal=['Delivered','Cancelled'];
 if(terminal.includes(o.status)||o.vendorAcceptedAt)return false;
 if(!orderTargetsVendor(o))return false;
 return isPaymentApprovedForVendor(o);
}
function isAssignedPendingVendorOrder(o){
 const terminal=['Delivered','Cancelled'];
 if(terminal.includes(o.status)||o.vendorAcceptedAt)return false;
 return orderTargetsVendor(o);
}
function paymentText(o){if(o.paymentMethod==='cod')return 'Cash on Delivery';if(o.paymentMethod==='online')return 'Online / UPI';return 'Not specified'}
function paymentStatus(o){if(o.paymentStatus==='paid')return 'Confirmed';if(o.paymentStatus==='processing')return 'Processing';if(o.paymentStatus==='pending')return 'Verification Pending';if(o.paymentStatus==='not_required')return 'COD';return 'Pending'}
function isPaymentApprovedForVendor(o){
 if(!o)return false;
 if(o.paymentMethod!=='online')return true;
 const s=String(o.status||'').toLowerCase();
 return o.paymentStatus==='paid'||s.includes('online payment - confirmed')||s.includes('payment confirmed');
}



async function captureVendorLocationOnce(){
  if(!vendor)return;
  if(!navigator.geolocation){zAlert('Geolocation is not supported on this device/browser.');return}
  navigator.geolocation.getCurrentPosition(async p=>{
    const loc={
      lat:Number(p.coords.latitude),
      lng:Number(p.coords.longitude),
      accuracy:Number(p.coords.accuracy||0),
      updatedAt:Date.now(),
      online:false,
      source:'manual'
    };
    try{
      await vendorsRef.child(vendor.firebaseKey).child('currentLocation').set(loc);
      vendor.currentLocation=loc;
      toast('Location updated successfully.');
      renderDashboard();
    }catch(err){
      console.error(err);
      zAlert('Could not save location.');
    }
  },e=>{
    zAlert(e.code===1?'Location permission was denied. Please allow location access.':'Could not get current location.');
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
window.captureVendorLocationOnce=captureVendorLocationOnce;

function renderDashboard(){
 if(!vendor)return;
 const mine=orders.filter(belongsToVendor).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const activeMine=mine.filter(o=>!(o.status==='Delivered'||o.deliveryStatus==='Delivered') && !String(o.status||'').toLowerCase().includes('cancel'));
 const deliveredMine=mine.filter(o=>o.status==='Delivered'||o.deliveryStatus==='Delivered');
 const incomingAll=orders.filter(o=>isAssignedPendingVendorOrder(o)&&vendor.workStatus!=='Inactive').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const incoming=incomingAll.filter(isClaimable);
 const waitingPayment=incomingAll.filter(o=>o.paymentMethod==='online'&&!isPaymentApprovedForVendor(o));
 const accepted=activeMine.filter(o=>['Vendor Accepted','Preparing','Ready for Pickup'].includes(o.vendorStatus)).length;
 const ready=activeMine.filter(o=>o.vendorStatus==='Ready for Pickup').length;
 const delivered=deliveredMine.length;
 $('#app').innerHTML=`<div class="card"><div class="row mobile-col"><div><h2 style="margin:0">Welcome, ${esc(vendor.name)}</h2><div class="muted small">${esc(vendor.email)} · ${esc(vendor.phone||'')}</div></div><span class="badge">${vendor.currentLocation?.online?'Location Saved':'Location Saved'}</span></div>
 
 <div class="small muted" style="margin-top:8px">Saved Location: ${vendor.currentLocation?.lat?`${Number(vendor.currentLocation.lat).toFixed(6)}, ${Number(vendor.currentLocation.lng).toFixed(6)}`:'Not available'}</div>
<div class="actions"><button class="btn btn-outline" onclick="captureVendorLocationOnce()"><i class="fa-solid fa-location-crosshairs"></i> Update Location Once</button></div></div>
 <div class="grid"><div class="stat"><b>${incomingAll.length}</b><span>New Orders</span></div><div class="stat"><b>${waitingPayment.length}</b><span>Payment Pending</span></div><div class="stat"><b>${accepted}</b><span>Accepted</span></div><div class="stat"><b>${ready}</b><span>Ready</span></div></div>
 <button type="button" class="card" onclick="showMyProducts()" style="width:100%;text-align:left;cursor:pointer;color:inherit">
  <div class="row">
    <div>
      <h3 style="margin:0"><i class="fa-solid fa-box-open" style="color:var(--accent)"></i> My Products</h3>
      <div class="muted small" style="margin-top:5px">${products.filter(p=>p.vendorId===vendor.firebaseKey).length} products · Tap to view and manage</div>
    </div>
    <div style="width:42px;height:42px;border-radius:50%;background:var(--light);color:var(--accent);display:grid;place-items:center;font-size:18px;flex-shrink:0">
      <i class="fa-solid fa-chevron-right"></i>
    </div>
  </div>
 </button>
 <button type="button" class="card" onclick="showMyVendorOrders()" style="width:100%;text-align:left;cursor:pointer;color:inherit">
  <div class="row">
    <div>
      <h3 style="margin:0"><i class="fa-solid fa-clipboard-list" style="color:var(--accent)"></i> My Vendor Orders</h3>
      <div class="muted small" style="margin-top:5px">${deliveredMine.length} delivered orders · Tap to view</div>
    </div>
    <div style="width:42px;height:42px;border-radius:50%;background:var(--light);color:var(--accent);display:grid;place-items:center;font-size:18px;flex-shrink:0">
      <i class="fa-solid fa-chevron-right"></i>
    </div>
  </div>
 </button>
 <div class="card"><h3 style="margin-top:0">New Customer Orders (${incomingAll.length})</h3>${incomingAll.length?incomingAll.map(o=>orderHtml(o,false)).join(''):'<div class="muted">No new orders right now.</div>'}</div>
 <div class="card">
  <h3 style="margin-top:0">Active Vendor Orders (${activeMine.length})</h3>
  ${activeMine.length
    ? activeMine.map(o=>orderHtml(o,true)).join('')
    : '<div class="muted">No active accepted orders right now.</div>'}
 </div>`;

 const mine=products.filter(p=>p.vendorId===vendor.firebaseKey);
 $('#app').innerHTML=`
  <div class="card">
   <div class="row mobile-col" style="align-items:flex-start">
    <div>
     <button class="btn btn-outline" onclick="renderDashboard()" style="margin-bottom:12px">
      <i class="fa-solid fa-arrow-left"></i> Back
     </button>
     <h2 style="margin:0">My Products (${mine.length})</h2>
     <div class="muted small" style="margin-top:4px">View, add, edit or delete your products.</div>
    </div>
    <button class="btn" onclick="showProductForm()"><i class="fa-solid fa-plus"></i> Add Product</button>
   </div>
   <div id="vendor-products" style="margin-top:14px">${productHtml(mine)}</div>
  </div>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
window.showMyProducts=showMyProducts;

    .filter(o=>o.status==='Delivered'||o.deliveryStatus==='Delivered')
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  $('#app').innerHTML=`
    <div class="card">
      <div class="row mobile-col" style="align-items:flex-start">
        <div>
          <button class="btn btn-outline" onclick="renderDashboard()" style="margin-bottom:12px">

function productHtml(list){
 if(!list.length)return '<div class="muted" style="margin-top:10px">No products yet.</div>';
 return list.map(p=>`<div class="order"><div class="row"><div><b>${esc(p.name||'Product')}</b><div class="small muted">${esc(p.category||'')} · Your Price: ${money(Number(p.vendorPrice ?? p.price ?? 0))}</div></div><span class="badge">${p.active===false?'Inactive':'Active'}</span></div>${(p.imageUrl||(Array.isArray(p.imageUrls)?p.imageUrls[0]:''))?`<img src="${esc(p.imageUrl||(Array.isArray(p.imageUrls)?p.imageUrls[0]:''))}" style="width:70px;height:70px;object-fit:cover;border-radius:10px;margin-top:8px">`:''}<div class="actions"><button class="btn btn-outline" onclick="editProduct('${esc(p.firebaseKey)}')">Edit</button><button class="btn btn-danger" onclick="deleteProduct('${esc(p.firebaseKey)}')">Delete</button></div></div>`).join('');
}
function showProductForm(editKey=''){
 const p=products.find(x=>x.firebaseKey===editKey)||{}, area=$('#vendor-products'); if(!area)return;
 area.innerHTML=`<div class="notice"><h3 style="margin-top:0">${editKey?'Edit':'Add'} Product</h3><label>Product Name *</label><input id="vp-name" value="${esc(p.name||'')}"><label>Your Price (₹) *</label><input id="vp-price" type="number" min="0" value="${Number(p.vendorPrice ?? p.price ?? 0)}"><div class="small muted" style="margin-top:5px">This is your vendor price. Admin can set a separate customer selling price.</div><label>MRP (₹)</label><input id="vp-mrp" type="number" min="0" value="${Number(p.vendorMrp ?? p.priceMrp ?? 0)}"><label>Category</label><input id="vp-cat" value="${esc(p.category||'')}"><label>Image</label><input id="vp-img-file" type="file" accept="image/*"><input id="vp-img" placeholder="Or image URL" value="${esc(p.imageUrl||(Array.isArray(p.imageUrls)?p.imageUrls[0]:''))}"><div class="actions"><button class="btn" onclick="saveProduct('${esc(editKey)}')">Save Product</button><button class="btn btn-outline" onclick="showMyProducts()">Cancel</button></div></div>`;
}
function fileData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function saveProduct(key){
 if(!vendor)return;
 const name=$('#vp-name').value.trim(),price=Number($('#vp-price').value||0),mrp=Number($('#vp-mrp').value||0),category=$('#vp-cat').value.trim();
 if(!name||price<0){zAlert('Enter product name and valid price.');return}
 let imageUrl=$('#vp-img').value.trim();const f=$('#vp-img-file').files?.[0];
 if(f){if(f.size>1200000){zAlert('Image must be under 1.2 MB.');return}imageUrl=await fileData(f)}
 const k=key||productsRef.push().key, old=products.find(p=>p.firebaseKey===key)||{};
 const imageUrls=imageUrl?[imageUrl]:[];
 await productsRef.child(k).set({
   ...old,
   firebaseKey:k,
   id:old.id||k,
   name,
   vendorPrice:price,
   vendorMrp:mrp,
   // Customer/admin selling price is separate. Existing Admin price is preserved on vendor edits.
   price:Object.prototype.hasOwnProperty.call(old,'price')?Number(old.price||0):price,
   priceMrp:Object.prototype.hasOwnProperty.call(old,'priceMrp')?Number(old.priceMrp||0):mrp,
   category,
   imageUrl,
   imageUrls,
   active:true,
   vendorId:vendor.firebaseKey,
   vendorName:vendor.name,
   vendorEmail:vendor.email,
   createdAt:old.createdAt||Date.now(),
   updatedAt:Date.now()
 });
 toast('Product saved.');showMyProducts();
}
function editProduct(k){showProductForm(k)}
async function deleteProduct(k){const p=products.find(x=>x.firebaseKey===k);if(!p||p.vendorId!==vendor.firebaseKey)return;if(!await zConfirm('Delete this product?'))return;await productsRef.child(k).remove();toast('Product deleted.');showMyProducts()}
window.showProductForm=showProductForm;window.saveProduct=saveProduct;window.editProduct=editProduct;window.deleteProduct=deleteProduct;

function vendorOrderAmount(o){
 const items=Array.isArray(o?.items)?o.items:[];
 return items.reduce((sum,i)=>{
   const qty=Math.max(1,Number(i.qty)||1);

   const product=products.find(p=>
     String(p.firebaseKey||p.id||'')===String(i.productId||i.id||'')
   );

   const unit=Number(
     product?.vendorPrice ??
     i.vendorPrice ??
     i.vendorUnitPrice ??
     product?.price ??
     i.price ??
     0
   );

   return sum+(unit*qty);
 },0);
}
function orderHtml(o,mine){
 const vs=o.vendorStatus||'New';
 const readyAt=o.vendorReadyAt?new Date(o.vendorReadyAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
 return `<div class="order"><div class="row"><b>#${esc(o.orderId||'')}</b><span class="badge ${vs==='Ready for Pickup'?'':'warn'}">${esc(vs)}</span></div>
 <div style="font-weight:800;margin-top:8px">${esc(o.customer?.name||'Customer')}</div>
 <div class="muted small"><i class="fa-solid fa-phone"></i> ${esc(o.customer?.phone||'—')}</div>
 <div class="muted small" style="margin-top:4px"><i class="fa-solid fa-location-dot"></i> ${esc(o.customer?.address||'—')}, ${esc(o.customer?.city||'')} ${esc(o.customer?.pincode||'')}</div>
 <div class="small" style="margin-top:8px"><b>Items:</b> ${esc((o.items||[]).map(i=>`${i.name||'Product'} × ${i.qty||1}`).join(', ')||'—')}</div>
 <div class="small" style="margin-top:7px"><b>Your Order Amount:</b> ${money(vendorOrderAmount(o))} &nbsp; <b>Payment:</b> ${esc(paymentText(o))} · ${esc(paymentStatus(o))}</div>
 ${o.vendorPrepMinutes?`<div class="notice small"><b>Preparation:</b> ${esc(o.vendorPrepMinutes)} minutes · ETA ${readyAt}</div>`:''}
 ${o.deliveryBoy?`<div class="notice small"><b>Delivery Boy:</b> ${esc(o.deliveryBoy.name||'Assigned')} · ${esc(o.deliveryStatus||'Assigned')}</div>`:''}
 <div class="actions">
 ${!mine?(isPaymentApprovedForVendor(o)?`<button class="btn" onclick="acceptOrder('${esc(o.firebaseKey)}')"><i class="fa-solid fa-check"></i> Accept Order</button>`:`<button class="btn" disabled style="opacity:.55;cursor:not-allowed"><i class="fa-solid fa-lock"></i> Waiting for Payment Confirmation</button><div class="notice small" style="width:100%;background:#fff7db;color:#8a6200"><b>Online payment not confirmed yet.</b><br>Admin must confirm the UPI payment before you can accept this order.</div>`):
 vs==='Vendor Accepted'?`<button class="btn" onclick="setPrep('${esc(o.firebaseKey)}')"><i class="fa-solid fa-stopwatch"></i> Set Preparation Time</button>`:
 vs==='Preparing'?`<button class="btn" onclick="markReady('${esc(o.firebaseKey)}')"><i class="fa-solid fa-circle-check"></i> Mark Ready</button>`:
 vs==='Ready for Pickup'?`<span class="badge">Waiting for Delivery Pickup</span>`:''}
 ${o.customer?.phone?`<a class="btn btn-outline" href="tel:${esc(o.customer.phone)}"><i class="fa-solid fa-phone"></i> Call Customer</a>`:''}
 ${o.deliveryLocation?`<button class="btn btn-outline" type="button" onclick="openCustomerMap(${Number(o.deliveryLocation.lat)},${Number(o.deliveryLocation.lng)})"><i class="fa-solid fa-map-location-dot"></i> Location</button>`:''}
 </div></div>`;
}

function openCustomerMap(lat,lng){
  lat=Number(lat); lng=Number(lng);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)){
    zAlert('Customer location is not available.');
    return;
  }

  // Open the normal HTTPS Google Maps page in the same WebView.
  // This avoids Android intent/Play Store redirects caused by external-window handling.
  const url='https://www.google.com/maps/search/?api=1&query='+
    encodeURIComponent(lat+','+lng);
  window.location.assign(url);
}
window.openCustomerMap=openCustomerMap;

async function acceptOrder(key){
 if(!vendor)return;
 const ref=db.ref('orders/'+key);
 const r=await ref.transaction(o=>{
   if(!o||o.vendorAcceptedAt||['Delivered','Cancelled'].includes(o.status))return;
   if(!isPaymentApprovedForVendor(o))return;

   // Customer order is already assigned to a selected vendor.
   // Accept it only when that vendor is the currently logged-in vendor.
   const assignedVendorId=o.vendorId||o.vendor?.id||'';
   const assignedVendorEmail=String(o.vendorEmail||o.vendor?.email||'').trim().toLowerCase();
   const currentVendorEmail=String(vendor.email||'').trim().toLowerCase();
   const itemTargetsVendor=Array.isArray(o.items)&&o.items.some(i=>
     String(i.vendorId||'').trim()===String(vendor.firebaseKey||'').trim() ||
     (currentVendorEmail && String(i.vendorEmail||'').trim().toLowerCase()===currentVendorEmail)
   );
   if(assignedVendorId && assignedVendorId!==vendor.firebaseKey && assignedVendorEmail!==currentVendorEmail && !itemTargetsVendor)return;

   o.vendorId=vendor.firebaseKey;
   o.vendor={
     id:vendor.firebaseKey,
     name:vendor.name,
     email:vendor.email,
     phone:vendor.phone,
     address:vendor.address,
     city:vendor.city
   };
   o.vendorName=vendor.name;
   o.vendorEmail=vendor.email||'';
   o.vendorStatus='Vendor Accepted';
   o.vendorAcceptedAt=Date.now();
   o.deliveryOfferStatus='Available';
   o.deliveryStatus='Waiting for Delivery';
   o.status='Restaurant Accepted';
   return o;
 });
 if(r.committed){
   toast('Order accepted successfully.');
   renderDashboard();
 }else{
   const snap=await ref.once('value');
   const current=snap.val();
   if(current?.paymentMethod==='online'&&!isPaymentApprovedForVendor(current))toast('Payment is not confirmed by Admin yet. You cannot accept this order.');
   else toast('Order could not be accepted. Refresh the page and try again.');
 }
}
async function setPrep(key){
 const v=await zPrompt('How many minutes will the order take to be ready?', '20');
 if(v===null)return; const min=Math.max(1,Math.floor(Number(v)||0)); if(!min){toast('Enter a valid number of minutes.');return}
 await db.ref('orders/'+key).update({vendorPrepMinutes:min,vendorStatus:'Preparing',vendorPrepStartedAt:Date.now(),vendorReadyAt:Date.now()+min*60000,deliveryTimer:min,deliveryOfferStatus:'Available',status:'Preparing'});
 toast(`Preparation time set to ${min} minutes.`);
}
async function markReady(key){
 await db.ref('orders/'+key).update({vendorStatus:'Ready for Pickup',vendorReadyAt:Date.now(),deliveryOfferStatus:'Available',status:'Ready for Pickup'});
 toast('Order marked Ready for Pickup. Delivery can pick it up now.');
}
if(session)loadApp();else showAuth();
